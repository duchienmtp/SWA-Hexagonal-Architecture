services:
  postgresql:
    container_name: postgres_db
    image: postgres:14
    environment:
      POSTGRES_USER: kagami
      POSTGRES_PASSWORD: kagami
      POSTGRES_DB: postgres  # Set a default database
    volumes:
      - postgres_db_data:/data/postgres
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - microservices-net
    restart: unless-stopped

  pgadmin:
    container_name: ms_pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - microservices-net
    restart: unless-stopped

  mongodb:
    container_name: mongo_db
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: kagami
      MONGO_INITDB_ROOT_PASSWORD: kagami
    volumes:
      - mongodb_data:/data/db
    networks:
      - microservices-net
    restart: unless-stopped

  mongo-express:
    container_name: mongo_express
    image: mongo-express
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=kagami
      - ME_CONFIG_MONGODB_ADMINPASSWORD=kagami
      - ME_CONFIG_MONGODB_SERVER=mongodb
    ports:
      - 8083:8081
    networks:
      - microservices-net
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0 # Confluent Platform Version 7.5.0 = Apache Kafka Core Version 3.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "22181:2181"
    networks:
      - microservices-net
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0 # Confluent Platform Version 7.5.0 = Apache Kafka Core Version 3.5.0
    container_name: ms_kafka
    ports:
      - "9092:9092" # host access
    depends_on:
      - zookeeper
    environment:
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    networks:
      - microservices-net
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080" 
    networks:
      - microservices-net
    depends_on:
      - kafka
      - zookeeper
    environment:
      # This is the name of your Kafka cluster as it appears in the UI
      KAFKA_CLUSTERS_0_NAME: local-cluster 
      # The UI uses the internal Docker network name and port to connect
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092 
    restart: unless-stopped
    
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: schema-registry
    ports:
      - "8082:8082"
    depends_on:
      - kafka
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092' # Point to your Kafka broker
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8082
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8082/subjects"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-net
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq  
    ports:
      - "15672:15672"
      - "5672:5672"
    environment:
      RABBITMQ_DEFAULT_USER: kagami
      RABBITMQ_DEFAULT_PASS: kagami
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq
    networks:
      - microservices-net
    restart: unless-stopped

  config-server:
    build:
      context: ./services/config-server
    container_name: config-server
    environment:
      SPRING_PROFILES_ACTIVE: native
    ports:
      - "8888:8888"
    networks:
      - microservices-net
    depends_on:
      - postgresql
      - mongodb
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  discovery-service:
    build:
      context: ./services/discovery-service
    container_name: discovery-service
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    ports:
      - "8761:8761"
    networks:
      - microservices-net
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: api-gateway
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
    ports:
      - "8222:8222"
    networks:
      - microservices-net
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      order-service:
        condition: service_started
    restart: unless-stopped

  order-service:
    build:
      context: ./services/order-service
    container_name: order-service
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/order-service
      SPRING_DATASOURCE_USERNAME: kagami
      SPRING_DATASOURCE_PASSWORD: kagami
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL: http://schema-registry:8082
    ports:
      - "8070:8070"
    networks:
      - microservices-net
    depends_on:
      postgresql:
        condition: service_started
      kafka:
        condition: service_started
      schema-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build: 
      context: ./services/notification-service
    container_name: notification-service
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      SPRING_DATA_MONGODB_URI: mongodb://kagami:kagami@mongodb:27017/notification?authSource=admin
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL: http://schema-registry:8082
    ports:
      - "8040:8040"
    networks:
      - microservices-net
    depends_on:
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
      schema-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    restart: unless-stopped

  customer-service:
    build: 
      context: ./services/customer-service
    container_name: customer-service
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      SPRING_DATA_MONGODB_URI: mongodb://kagami:kagami@mongodb:27017/customer?authSource=admin
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL: http://schema-registry:8082
    ports:
      - "8090:8090"
    networks:
      - microservices-net
    depends_on:
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
      schema-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    restart: unless-stopped

  payment-service:
    build:
      context: ./services/payment-service
    container_name: payment-service
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/payment-service
      SPRING_DATASOURCE_USERNAME: kagami
      SPRING_DATASOURCE_PASSWORD: kagami
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL: http://schema-registry:8082
    ports:
      - "8060:8060"
    networks:
      - microservices-net
    depends_on:
      postgresql:
        condition: service_started
      kafka:
        condition: service_started
      schema-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    restart: unless-stopped

  restaurant-service:
    build:
      context: ./services/restaurant-service
    container_name: restaurant-service
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/restaurant-service
      SPRING_DATASOURCE_USERNAME: kagami
      SPRING_DATASOURCE_PASSWORD: kagami
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL: http://schema-registry:8082
    ports:
      - "8050:8050"
    networks:
      - microservices-net
    depends_on:
      postgresql:
        condition: service_started
      kafka:
        condition: service_started
      schema-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025"   # SMTP server
      - "8025:8025"   # Web UI
    networks:
      - microservices-net
    restart: unless-stopped

networks:
  microservices-net:
    driver: bridge

volumes:
  postgres_db_data:
  pgadmin:
  mongodb_data:
  rabbitmq-data:
  rabbitmq-log: